<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consort Diagram Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar">
            <header>
                <h1>Consort Gen</h1>
                <p>Clinical Trial Flow Diagram</p>
            </header>

            <div class="controls">
                <section class="control-group">
                    <h2>Enrollment</h2>
                    <div class="input-field">
                        <label for="assessed">Assessed for Eligibility</label>
                        <input type="number" id="assessed" value="0" placeholder="Total number">
                    </div>
                </section>

                <section class="control-group">
                    <h2>Excluded</h2>
                    <div id="exclusion-list">
                        <!-- Dynamic inputs will go here -->
                    </div>
                    <button id="add-exclusion-btn" class="btn-secondary">+ Add Exclusion Reason</button>

                    <div class="input-field mt-2">
                        <label>Total Excluded (Auto-calc)</label>
                        <input type="number" id="total-excluded" readonly>
                    </div>
                </section>

                <section class="control-group">
                    <h2>Allocation</h2>
                    <div class="input-field">
                        <label>Number of Arms</label>
                        <select id="arm-count">
                            <option value="2">2 Groups</option>
                            <option value="3">3 Groups</option>
                            <option value="4">4 Groups</option>
                        </select>
                    </div>
                    <div id="arms-config">
                        <!-- Dynamic arm config -->
                    </div>
                </section>

                <section class="control-group">
                    <h2>Appearance</h2>
                    <div class="input-field">
                        <label>Theme</label>
                        <select id="theme-select">
                            <option value="classic">Scientific (Classic)</option>
                            <option value="modern">Modern Blue</option>
                            <option value="dark">Dark Mode</option>
                        </select>
                    </div>
                </section>

                <div class="actions">
                    <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                        <button id="export-svg-btn" class="btn-secondary">Export to SVG</button>
                        <button id="export-png-btn" class="btn-secondary">Export to PNG</button>
                        <button id="export-jpg-btn" class="btn-secondary">Export to JPG</button>
                    </div>
                </div>
            </div>
        </aside>

        <main class="preview-area">
            <div id="diagram-container" class="consort-diagram">
                <!-- Diagram will be rendered here -->
            </div>
        </main>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
